name: Personal Coach

on:
  schedule:
    - cron: '0 6 * * *'   # daily ~08:00 CEST (06:00 UTC)
    - cron: '0 17 * * 0'  # Sunday ~19:00 CEST (17:00 UTC)
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        type: choice
        options: [daily, weekly]
        default: daily

permissions: {}

jobs:
  coach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Restore coach data
        env:
          COACH_JSON: ${{ secrets.COACH_JSON }}
        run: echo "$COACH_JSON" > coach.json

      - name: Run coach
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTES_JSON: ${{ secrets.NOTES_JSON }}
          MODE: ${{ inputs.mode || '' }}
        run: npx tsx src/index.ts

      - name: Persist coach data
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: gh secret set COACH_JSON --repo ${{ github.repository }} < coach.json
